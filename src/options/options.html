<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Full Experience: options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Options</h1>
      <label class="toggle">
        <input type="checkbox" id="playcounts" disabled />
        <span>
          <strong>Play counts on album pages</strong>
          <small>Adds a play count column to album track lists, as in the desktop app.</small>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="likedSongs" disabled />
        <span>
          <strong>Liked songs on artist pages</strong>
          <small>Shows how many of the artist's songs you liked, with the list. Builds a local index of your liked songs: a couple of requests the first time, then at most one every 10 minutes.</small>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="playlistTools" disabled />
        <span>
          <strong>Search and sort in playlists</strong>
          <small>Adds "search in playlist" and "sort by" to playlists and Liked Songs, as in the desktop app. A playlist's songs are loaded (usually one request) only when you search or sort it.</small>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="debug" disabled />
        <span>
          <strong>Debug mode</strong>
          <small>Logs the structure of the web player's internal requests to the page console. Reload the Spotify tab after changing it.</small>
        </span>
      </label>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
